[project]
name = "agent"
version = "0.1.0"
description = "Deep Agents chatbot: FastAPI + React + Redis worker running LangChain DeepAgents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "deepagents>=0.7.21",
    "fastapi>=0.142.2",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-quickjs>=0.3.8",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=5",
    "streamlit>=1.40.0",
    "tavily-python>=0.8.4",
    "uvicorn[standard]>=0.54.0",
]
